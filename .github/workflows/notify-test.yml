name: notify-test
on: workflow_dispatch
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || '1' }}
        run: gh api repos/${{ github.repository }}/issues/$ISSUE/comments -f body='@fiultyy [bot] 通知轮询 e2e 测试'
