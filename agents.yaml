# AO2 agent 持久化配置(P0 seed)。
# 位置:repo 根(agent_registry._locate_config 经 git-root 推断找此;优先级 =
# AO2_AGENTS_CONFIG env > AO2_REPO_ROOT/agents.yaml > <git-root>/agents.yaml >
# <stateDir>/agents.yaml)。此前放 services/orchestrator/ 是 bug(start.sh cwd=
# repo 根 vs Makefile dev-orch cwd=services/orchestrator 不一致,load path 找
# cwd/agents.yaml 漏 services/orchestrator/),移根为规范位置 + git-root 推断统一。
# workspace 显式指 repo root:向后兼容——_active_cwd 默认 = workspace = repo root
# = 等价今天(单 cwd 退化)。cwds 空(P0 不引入多 cwd 行为;P1 才填 cwd scope)。
defaults:
  model: glm-4.7
  workspace_base: null
  skills: []
agents:
  - id: native
    default: true
    name: 原生 harness 迭代专员
    model: glm-4.7
    workspace: /home/yy/projects/agent-os-v2
    cwds:
      - path: services/orchestrator
        label: orchestrator
        default: true
      - path: services/observe
        label: observe
      - path: apps/tui-rs
        label: tui-rs
    skills: [ao2-architecture]
    effort: medium
