services:
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      # sqlite 持久化:sqlitestore.py db_path="data/memories.db" + engine.py PITFALLS_DB=data/pitfalls.db
      - ./services/orchestrator/data:/app/data
    environment:
      # orchestrator→observe(TUI 观测层;容器内用服务名,localhost 解析自身致 ingest 断)
      - OBSERVE_URL=http://observe:8002
      # 私人系统:智谱 anthropic 协议 + glm-4.7(coding plan 额度在 /api/anthropic 通道)
      - LLM_API_FORMAT=anthropic
      - ANTHROPIC_BASE_URL=https://open.bigmodel.cn/api/anthropic
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - LLM_ANTHROPIC_MODEL=glm-4.7
      - MEMORY_EVENT_BUS_ENABLED=1
      - MEMORY_RETRIEVER_ENABLED=1
      - EMBEDDING_PROVIDER=api
      - EMBEDDING_BASE_URL=http://host.docker.internal:16666/v1
      - EMBEDDING_API_KEY=lm-studio
      - EMBEDDING_MODEL=text-embedding-qwen3-embedding-4b
      - EMBEDDING_DIMENSIONS=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  observe:
    # TUI 观测层(web 弃用后 TUI 接力):收 orchestrator /ws/ingest + 推 TUI /ws/subscribe。
    # 端口 8002 固定(tui-rs 硬编码 OBSERVE_WS=ws://localhost:8002)。与 prompt-manager
    # aux profile 端口互斥(aux 默认不启动;若 --profile aux up 同启需手动处理)。
    build:
      context: ./services/observe
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - OBSERVE_PORT=8002
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prompt-manager:
    profiles: ["aux"]
    build:
      context: ./services/prompt-manager
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./services/prompt-manager/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  resource-manager:
    profiles: ["aux"]
    build:
      context: ./services/resource-manager
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./services/resource-manager/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8004/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
