services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos_dev
      POSTGRES_DB: agentos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8000
      - API_URL=http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/gateway/src:/app/src
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - PROMPT_MANAGER_URL=http://prompt-manager:8002
      - CONVERSATION_OBSERVER_URL=http://conversation-observer:8003
      - RESOURCE_MANAGER_URL=http://resource-manager:8004
    depends_on:
      orchestrator:
        condition: service_healthy
      prompt-manager:
        condition: service_healthy
      conversation-observer:
        condition: service_healthy
      resource-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./services/orchestrator/src:/app/src
    environment:
      - GATEWAY_URL=http://gateway:8000
      - DATABASE_URL=postgresql+asyncpg://agentos:agentos_dev@postgres:5432/agentos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prompt-manager:
    build:
      context: ./services/prompt-manager
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./services/prompt-manager/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  conversation-observer:
    build:
      context: ./services/conversation-observer
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - ./services/conversation-observer/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  resource-manager:
    build:
      context: ./services/resource-manager
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./services/resource-manager/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
