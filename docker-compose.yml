services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js standalone rewrites 在 next build 时固化 env(runtime 无效),须 build 时注入容器名
        # API_URL 不带 /v1:gateway 路由裸路径(main.py: /memories /agents /debug),带 /v1 会 404
        - API_URL=http://gateway:8000
        - ORCHESTRATOR_WS_URL=http://orchestrator:8001
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8001
      # aux 兜底 URL:aux profile 默认不启动,调用时 503(gateway _aux_call 降级),不阻塞启动
      - PROMPT_MANAGER_URL=http://prompt-manager:8002
      - RESOURCE_MANAGER_URL=http://resource-manager:8004
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL:docker-compose v1 把 CMD 数组按空格分割致 -c 脚本截断;改单字符串 sh -c 执行
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      # sqlite 持久化:sqlitestore.py db_path="data/memories.db" + engine.py PITFALLS_DB=data/pitfalls.db(相对 /app)
      - ./services/orchestrator/data:/app/data
    environment:
      - GATEWAY_URL=http://gateway:8000
      # 私人系统:智谱 anthropic 协议 + glm-4.7(coding plan 额度在 /api/anthropic 通道)
      - LLM_API_FORMAT=anthropic
      - ANTHROPIC_BASE_URL=https://open.bigmodel.cn/api/anthropic
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - LLM_ANTHROPIC_MODEL=glm-4.7
      - MEMORY_EVENT_BUS_ENABLED=1
      - MEMORY_RETRIEVER_ENABLED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prompt-manager:
    profiles: ["aux"]
    build:
      context: ./services/prompt-manager
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./services/prompt-manager/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  resource-manager:
    profiles: ["aux"]
    build:
      context: ./services/resource-manager
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./services/resource-manager/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8004/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
