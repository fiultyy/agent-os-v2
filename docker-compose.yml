services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos_dev
      POSTGRES_DB: agentos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8000
      - API_URL=http://gateway:8000
      - ORCHESTRATOR_WS_URL=http://orchestrator:8001
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/gateway/src:/app/src
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - PROMPT_MANAGER_URL=http://prompt-manager:8002
      - RESOURCE_MANAGER_URL=http://resource-manager:8004
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./services/orchestrator/src:/app/src
    environment:
      - GATEWAY_URL=http://gateway:8000
      - DATABASE_URL=postgresql+asyncpg://agentos:agentos_dev@postgres:5432/agentos
      # 私人系统(全生命周期单人用):智谱 anthropic 协议 + glm-4.7(coding plan 额度在此通道)
      # 注:glm-4.7 走 openai paas/v4 通道会 429(资源包不足);anthropic /api/anthropic 通道有 coding plan 额度
      - LLM_API_FORMAT=anthropic
      - ANTHROPIC_BASE_URL=https://open.bigmodel.cn/api/anthropic
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - LLM_ANTHROPIC_MODEL=glm-4.7
      - MEMORY_EVENT_BUS_ENABLED=1
      - MEMORY_RETRIEVER_ENABLED=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prompt-manager:
    profiles: ["aux"]
    build:
      context: ./services/prompt-manager
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./services/prompt-manager/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  resource-manager:
    profiles: ["aux"]
    build:
      context: ./services/resource-manager
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./services/resource-manager/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
