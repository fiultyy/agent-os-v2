[project]
name = "agent-os-prompt-manager"
version = "0.1.0"
description = "Prompt template management service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "jinja2>=3.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
