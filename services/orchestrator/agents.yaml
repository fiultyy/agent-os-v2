# AO2 agent 持久化配置(P0 seed)。
# 设计文档 §4.1。engine.py cwd 在 services/orchestrator/,与 ORCH_SESSIONS_DB 的 cwd 相对
# idiom 一致——故 seed 放 services/orchestrator/ 顶层(别放 src/,会被 pythonpath 当模块)。
# workspace 显式指 repo root:向后兼容——相对路径基准今天 = 进程 cwd = repo root,seed 让
# workspace = repo root 则 _active_cwd 默认 = workspace = repo root = 等价今天(单 cwd 退化)。
# cwds 先空(P0 不引入多 cwd 行为;workspace=repo root 即单 cwd 退化基准,P1 才填 cwd scope)。
defaults:
  model: glm-4.7
  workspace_base: null
  skills: []
agents:
  - id: native
    default: true
    name: 原生 harness 迭代专员
    model: glm-4.7
    workspace: /home/yy/projects/agent-os-v2
    cwds: []
    skills: [ao2-architecture]
    effort: medium
