[project]
name = "agent-os-orchestrator"
version = "0.1.0"
description = "Agent Orchestration Service — core of Agent OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "grpcio>=1.71",
    "grpcio-tools>=1.71",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
