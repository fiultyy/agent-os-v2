[project]
name = "agent-os-orchestrator"
version = "0.1.0"
description = "Agent Orchestration Service — core of Agent OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "grpcio>=1.71",
    "grpcio-tools>=1.71",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.7",
    "numpy>=1.26",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.0",
    "networkx>=3.3",
    "websockets>=14.0",
    "pydantic-ai>=2.0",
]

[project.optional-dependencies]
hot-reload = [
    "watchdog>=4.0",
]

[project.scripts]
"agent-os" = "skills.cli:skill_cli_main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
