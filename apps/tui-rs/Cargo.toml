[package]
name = "v2-tui-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "v2-tui-rs"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
