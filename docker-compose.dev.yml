# DEV override —— "改代码不 rebuild"(hot-reload)
#
# 合并语义(已对 docker-compose v1.29 / podman compose 4.9.3 验证):
#   - `command` 字段:整体替换(production 的 CMD 数组被 dev command 覆盖)。
#   - `volumes` 列表:追加(production 已有项保留 + 新增项叠加)。
#   - `environment` 列表:按 KEY 合并(同 KEY 覆盖,新 KEY 追加)。
#   - `build`:mapping 合并,`dockerfile` 子键被覆盖(production → Dockerfile.dev)。
#
# web 弃用(2026-07-18):web service + Dockerfile.dev 已从 production compose 删除,
# 此 override 不再含 web 段。TUI 接力:orchestrator + observe + (gateway 待退役)。
#
# 使用:
#   首次/依赖变更后:`docker compose build`
#   日常开发:    `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
#   改 Python(host 编辑 services/*/src)→ uvicorn --reload 自动重启

services:
  # ── orchestrator:uvicorn --reload + src bind mount ──────────────────────
  orchestrator:
    volumes:
      - ./services/orchestrator/src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - uvicorn
      - src.engine:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - /app/src

  # ── gateway:同 orchestrator(保留,待整体退役)─────────────────────────
  gateway:
    volumes:
      - ./services/gateway/src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - uvicorn
      - src.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src

  # ── observe:uvicorn --reload + src bind mount(TUI 观测层)──────────────
  observe:
    volumes:
      - ./services/observe/src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - uvicorn
      - src.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
      - --reload
      - --reload-dir
      - /app/src
